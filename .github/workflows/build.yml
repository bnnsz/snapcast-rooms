name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build installer and portable image
        run: |
          ./gradlew --no-daemon \
            packageReleaseMsi createReleaseDistributable \
            -PappVersion=${{ steps.version.outputs.value }}

      - name: Package the portable image
        run: |
          cd "build/compose/binaries/main-release/app"
          7z a -tzip "../SnapcastRooms-${{ steps.version.outputs.value }}-portable.zip" "Snapcast Rooms"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapcast-rooms-${{ steps.version.outputs.value }}
          path: |
            build/compose/binaries/main-release/msi/*.msi
            build/compose/binaries/main-release/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            build/compose/binaries/main-release/msi/*.msi
            build/compose/binaries/main-release/*.zip
